name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv venv --python "${{ matrix.python-version }}" --no-project
      - run: uv pip install --python .venv --upgrade --requirements pyproject.toml --group dev
      - run: uv run --no-project python -m py_compile main.py
      - run: uv run --no-project python -c "import main"
      - run: uv run --no-project python main.py --help
      - run: uv run --no-project ruff check main.py
      - run: uv run --no-project ruff format --check main.py

  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - run: uv venv --python "3.14" --no-project
      - run: uv pip install --python .venv --upgrade --requirements pyproject.toml --group dev
      - name: Verify tracked Python and language policy
        run: >-
          uv run --no-project python -c "import pathlib,re,subprocess,sys;
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines();
          py=[item for item in files if item.endswith('.py')];
          han=re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\U00020000-\U000323af]');
          bad=[item for item in files if item != 'README_zh.md'
          and han.search(pathlib.Path(item).read_text(encoding='utf-8'))];
          print({'python':py,'han_violations':bad});
          sys.exit(0 if py == ['main.py'] and not bad else 1)"

  docker-smoke:
    env:
      IMAGE_NAME: ${{ github.event.repository.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build --pull --platform "${{ matrix.platform }}" --tag "${IMAGE_NAME}:ci" .
      - run: >-
          docker run --rm --entrypoint /bin/sh "${IMAGE_NAME}:ci"
          -c 'test "$(id -u)" -ne 0 && chromium --version && chromedriver --version
          && python -c "import apprise, bs4, filelock, selenium"'
